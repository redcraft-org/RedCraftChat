name: Release project

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Get POM version
        id: pom-version-extractor
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Get POM name
        id: pom-name-extractor
        run: echo "name=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pom-version-extractor.outputs.version }}
          NAME: ${{ steps.pom-name-extractor.outputs.name }}
        run: gh release create "$VERSION" "target/$NAME-$VERSION.jar" --title "$NAME $VERSION"
